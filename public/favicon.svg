<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Border -->
  <rect x="0" y="0" width="32" height="32" fill="#111112"/>
  <!-- Purple bg (inset 2px border) -->
  <rect x="2" y="2" width="28" height="28" fill="#7c3aed"/>
  <!-- CPU body -->
  <rect x="9" y="9" width="14" height="14" fill="none" stroke="white" stroke-width="2"/>
  <!-- CPU inner -->
  <rect x="12" y="12" width="8" height="8" fill="white"/>
  <!-- CPU pins top -->
  <line x1="12" y1="9" x2="12" y2="6" stroke="white" stroke-width="1.5"/>
  <line x1="16" y1="9" x2="16" y2="6" stroke="white" stroke-width="1.5"/>
  <line x1="20" y1="9" x2="20" y2="6" stroke="white" stroke-width="1.5"/>
  <!-- CPU pins bottom -->
  <line x1="12" y1="23" x2="12" y2="26" stroke="white" stroke-width="1.5"/>
  <line x1="16" y1="23" x2="16" y2="26" stroke="white" stroke-width="1.5"/>
  <line x1="20" y1="23" x2="20" y2="26" stroke="white" stroke-width="1.5"/>
  <!-- CPU pins left -->
  <line x1="9" y1="12" x2="6" y2="12" stroke="white" stroke-width="1.5"/>
  <line x1="9" y1="16" x2="6" y2="16" stroke="white" stroke-width="1.5"/>
  <line x1="9" y1="20" x2="6" y2="20" stroke="white" stroke-width="1.5"/>
  <!-- CPU pins right -->
  <line x1="23" y1="12" x2="26" y2="12" stroke="white" stroke-width="1.5"/>
  <line x1="23" y1="16" x2="26" y2="16" stroke="white" stroke-width="1.5"/>
  <line x1="23" y1="20" x2="26" y2="20" stroke="white" stroke-width="1.5"/>
</svg>
